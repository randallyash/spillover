[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The Homebrew tap the generated formula is pushed to, which is what makes
# `brew install randallyash/spillover/spill` work. Publishing needs that
# repository to exist and a HOMEBREW_TAP_TOKEN secret with push access to it —
# see packaging/README.md, and note that a release fails at the publish step
# until both are in place.
tap = "randallyash/homebrew-spillover"
publish-jobs = ["homebrew"]
