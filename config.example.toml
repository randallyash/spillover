# A working config, with the reasons written down.
#
# This is the arrangement I actually run, not a template with everything switched
# off: two tiers, one below the other, and comments saying why each line is what
# it is. Copy it to ~/.config/spill/config.toml and change what does not fit, or
# run `spill setup` and let the wizard write one for you.
#
# Keys never belong in this file. Name the environment variable that holds one
# with api_key_env, and keep the key itself in your shell.

schema = 1

[general]
# Where the file tools and any delegated CLI agent do their work.
#
# On Windows write this in single quotes — workspace = 'C:\Users\me\project' —
# because inside double quotes a backslash starts an escape sequence, so
# "C:\Users" is not valid TOML and "C:\x86" quietly parses into something that is
# not the path you meant.
workspace = "~"

# How many tool steps a turn may take before it is judged stuck. 32 is enough
# for a modest refactor; a model that never concludes still stops.
# max_steps = 32

# How many seconds a run_shell command may run. A single call can name a
# longer timeout_secs of its own, up to 1800.
# shell_timeout_secs = 300

# Once a turn has spilled to a lower tier, stay there for the rest of the
# session. Flip it off if you would rather every message started on DeepSeek
# again and only paid for Grok on the messages that needed it.
sticky_fallback = true

# Shell commands that run without being asked about.
#
# Left out, you get the read-only set — ls, cat, head, tail, wc, stat, file, du,
# df, grep, rg, and git's read-only subcommands. Each one is the shell spelling
# of a tool spill already runs unprompted (cat is read_file, ls is list_dir), so
# the list removes a prompt rather than giving the agent any reach it lacked.
# Everything else still stops and shows you the command first.
#
# A rule is a prefix of *words*, matched only against a command that has no shell
# operators in it. So "git status" cannot be talked around by
# "git status; rm -rf ~": that line holds a semicolon, so it always asks. The
# same goes for pipes, redirections, substitutions, globs and quotes — and for
# anything that sets a variable first, like FOO=bar ls.
#
# Commands whose *flags* can write or execute are not in the default list on
# purpose: find, sort, sed, xargs, awk, make, cargo, npm, python. A prefix of
# words cannot see a flag, so `find . -delete` would slip through one.
#
# allow_shell = [] asks about everything. `/allow <words>` adds a rule for the
# session, and `/allow save <words>` writes the whole list in force back here —
# surgically, so every comment on this page survives.
# allow_shell = ["make", "cargo test"]

# Nothing here chooses a session. Running `spill` with no arguments resumes the
# conversation for this workspace and writes it back as you go, one file per
# workspace under the state directory (~/.local/state/spill on Linux). `/clear`
# starts over, and `spill -p` neither reads nor writes one, so scripts stay
# stateless.

# ---------------------------------------------------------------------------
# Tier 1: the cheap model. Everything below it is only reached when this one
# stalls, loops, or fails outright — which is the whole point.
#
# Command Code's DeepSeek V4 Flash is what I actually run first: fast, cheap,
# and already logged in. A local OpenAI-compatible server (LM Studio, Ollama)
# belongs here instead if you have one — put it first and move this down.
# ---------------------------------------------------------------------------

[[tier]]
id = "deepseek"
kind = "cli"
name = "DeepSeek V4 Flash (Command Code)"
preset = "command-code"
model = "deepseek/deepseek-v4-flash"

# Ask the tier below instead of handing the turn over. This is also what a tier
# gets for saying nothing, and it is written out because it is the decision that
# matters most in this file: escalating is expensive. Grok re-reads the whole
# conversation, and then answers every remaining turn of the session, all
# because one turn went wrong and I lost the cheap model with it. A consult
# spends one call on one narrow question and DeepSeek keeps driving.
#
# It is safe either way. spill escalates anyway when the advice is no use — when
# the consult fails, when the budget runs out, when the answer comes back empty —
# so a turn can never be stranded by it. The two policies are genuinely different
# rather than one being the good one: if the honest answer is "go and read five
# more files", handing over is the right move, and consult is not. That is the
# line to change — `on_stuck = "escalate"` — if that is the trade you want.
on_stuck = "consult"

# Two is enough to get unstuck. More than that and a model in a loop is just
# spending the frontier slowly, which is the thing consult exists to avoid.
consults_per_turn = 2

# ---------------------------------------------------------------------------
# Tier 2: Grok, reached only when DeepSeek cannot finish.
#
# THIS is the expensive one, so it stays unspent until a stall actually happens.
# `spill presets` lists everything else spill can drive. If you have none of
# them, delete this tier — a chain of one is a supported way to run, and a
# stalled turn simply ends instead of spilling.
# ---------------------------------------------------------------------------

[[tier]]
id = "grok"
kind = "cli"
name = "Grok 4.6"
preset = "grok"
model = "grok-4.6"

# No on_stuck here: it takes the default like any tier that says nothing, and it
# is the last tier, so there is nobody below it to consult anyway — a stall ends
# the turn here whatever this says.

# ---------------------------------------------------------------------------
# Everything past this point is optional. The config above is the whole working
# setup; the rest is the other knobs, for when you want them.
# ---------------------------------------------------------------------------

# A local server instead of Command Code, tried first. Empty model means
# whatever the server has loaded:
#
# [[tier]]
# id = "local"
# kind = "openai"
# preset = "lmstudio"
# model = ""

# `approve_all` is off unless you set it. Turning it on lets that tier's CLI run
# without its own permission prompts, so it can change files unattended. spill
# says so out loud at startup when it is on.
#
# A `cli` tier can only be a consultant — the tier that answers a consult — if it
# has a read-only mode. spill cannot withhold tools from a harness it does not
# run, so a consult launches the CLI with that flag and an instruction not to
# act. The shipped presets already name the flag for the CLIs that have one:
#
# read_only_args = ["--permission-mode", "plan"]

# Session continuity for a `cli` tier. Without these, the whole conversation is
# flattened into the CLI's prompt on every turn, which means re-sending
# everything the earlier turns established. With them, the CLI keeps the
# conversation and spill sends only the new turn. Both take `{session}`; a CLI
# that mints its own id gets only resume_args. The shipped `grok` and
# `command-code` presets already set these.
#
# session_args = ["-s", "{session}"]
# resume_args = ["-r", "{session}"]

# Leaving them off is a supported arrangement rather than a broken one: the tier
# works exactly as it did before.
