# A working config, with the reasons written down.
#
# This is the arrangement I actually run, not a template with everything switched
# off: two tiers, one below the other, and comments saying why each line is what
# it is. Copy it to ~/.config/spill/config.toml and change what does not fit, or
# run `spill setup` and let the wizard write one for you.
#
# Keys never belong in this file. Name the environment variable that holds one
# with api_key_env, and keep the key itself in your shell.

schema = 1

[general]
# Where the file tools and any delegated CLI agent do their work.
#
# On Windows write this in single quotes — workspace = 'C:\Users\me\project' —
# because inside double quotes a backslash starts an escape sequence, so
# "C:\Users" is not valid TOML and "C:\x86" quietly parses into something that is
# not the path you meant.
workspace = "~"

# Once a turn has spilled to a lower tier, stay there for the rest of the
# session. Flip it off if you would rather every message started local again and
# only paid for the frontier on the messages that needed it.
sticky_fallback = true

# Nothing here chooses a session. Running `spill` with no arguments resumes the
# conversation for this workspace and writes it back as you go, one file per
# workspace under the state directory (~/.local/state/spill on Linux). `/clear`
# starts over, and `spill -p` neither reads nor writes one, so scripts stay
# stateless.

# ---------------------------------------------------------------------------
# Tier 1: the local model. Everything below it is only reached when this one
# stalls, loops, or fails outright — which is the whole point.
# ---------------------------------------------------------------------------

[[tier]]
id = "local"
kind = "openai"
name = "LM Studio (Qwen3 Coder)"
preset = "lmstudio"

# Empty on purpose. LM Studio is already holding Qwen3 Coder 30B — it will only
# have loaded whatever I picked in its own window — so naming a model here would
# mean keeping two lists in sync and a 404 the day I switch. Empty means "use
# whatever this server has loaded", which is what I actually want.
model = ""

# Ask the tier below instead of handing the turn over. Escalating is expensive:
# the frontier re-reads the whole conversation, and then answers every remaining
# turn of the session, all because one turn went wrong and I lost the cheap model
# with it. A consult spends one call on one narrow question and the local model
# keeps driving.
#
# This is safe to turn on. spill escalates anyway when the advice is no use —
# when the consult fails, when the budget runs out, when the answer comes back
# empty — so a turn can never be stranded by it. The two policies are genuinely
# different rather than one being the good one: if the honest answer is "go and
# read five more files", handing over is the right move, and consult is not.
on_stuck = "consult"

# Two is enough to get unstuck. More than that and a model in a loop is just
# spending the frontier slowly, which is the thing consult exists to avoid.
consults_per_turn = 2

# Overrides on what a local tier already gets. Leaving a field out keeps the
# class default rather than resetting it, so this block changes one number and
# inherits the rest.
#
# The class is decided by where the endpoint is: loopback, a LAN address and
# *.local get 120s to the first token and 30s of silence after that; anything
# over the network — and every `cli` tier, whose first line includes a harness
# starting up — gets 30s and 60s. `spill doctor` prints what each tier ended up
# with, which is the only way to be sure.
[tier.limits]
# The one I actually had to change. My local box is quick to its first token but
# can still go quiet for half a minute part-way through a long file, and the
# default 30s cut it off mid-answer.
idle_timeout_ms = 45000
# Consecutive identical lines that count as a loop. 4 is the default; lower it
# for a model that degenerates quickly, raise it for one that is just repetitive
# in the way prose is.
max_repeat_run = 4

# ---------------------------------------------------------------------------
# Tier 2: the frontier, reached only when the local model cannot finish.
#
# THIS IS THE LINE TO CHANGE. I have SuperGrok; `spill presets` lists everything
# spill can drive (Claude Code, Codex, Gemini CLI, Copilot, Cursor, opencode,
# Command Code, …) and `spill doctor` says which of them are installed here. If
# you have none of them, delete this tier — an all-local chain is a supported way
# to run, and a stalled turn simply ends instead of spilling.
# ---------------------------------------------------------------------------

[[tier]]
id = "grok"
kind = "cli"
name = "Grok 4.6 (SuperGrok)"
preset = "grok"

# The CLI would use its own default model, which is fine. Naming it keeps the
# tier honest about what is answering, and `spill doctor` then reports the same
# model the rail shows.
model = "grok-4.6"

# No on_stuck here: it is the last tier, so escalating is what happens whether or
# not it is written down. `escalate` is also the default everywhere, so a tier
# that says nothing about its policy behaves the way it always has.

# ---------------------------------------------------------------------------
# Everything past this point is optional. The config above is the whole working
# setup; the rest is the other knobs, for when you want them.
# ---------------------------------------------------------------------------

# A hosted provider instead of an agent CLI. This one needs a key in the
# environment, named rather than written down:
#
# [[tier]]
# id = "deepseek"
# kind = "openai"
# preset = "openrouter"
# api_key_env = "OPENROUTER_API_KEY"
# model = "deepseek/deepseek-v4-flash"

# `approve_all` is off unless you set it. Turning it on lets that tier's CLI run
# without its own permission prompts, so it can change files unattended. spill
# says so out loud at startup when it is on.
#
# A `cli` tier can only be a consultant — the tier that answers a consult — if it
# has a read-only mode. spill cannot withhold tools from a harness it does not
# run, so a consult launches the CLI with that flag and an instruction not to
# act. The shipped presets already name the flag for the CLIs that have one:
#
# read_only_args = ["--permission-mode", "plan"]

# Session continuity for a `cli` tier. Without these, the whole conversation is
# flattened into the CLI's prompt on every turn, which means re-sending
# everything the earlier turns established. With them, the CLI keeps the
# conversation and spill sends only the new turn. Both take `{session}`; a CLI
# that mints its own id gets only resume_args. The shipped `grok` and
# `command-code` presets already set these.
#
# session_args = ["-s", "{session}"]
# resume_args = ["-r", "{session}"]

# Leaving them off is a supported arrangement rather than a broken one: the tier
# works exactly as it did before.
